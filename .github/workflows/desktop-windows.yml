# Builds the Windows desktop installer (NSIS) on a real Windows machine.
#
# Manual only, on purpose — the Linux AppImage/.deb are built and attached
# to a GitHub Release by hand (`npm run desktop:build`), and this mirrors
# that: nothing builds or publishes on its own.
#
# How to use (GitHub → Actions → "Desktop (Windows)" → Run workflow):
#
#   * Leave "tag" empty  → just builds. Download the installer from the
#     run's "Artifacts" section at the bottom of the run page. Nothing is
#     published. Good for a test build to try on a Windows laptop.
#
#   * Put a tag in, e.g. v0.248.0 → builds THAT tag and attaches the
#     installer + latest.yml to the GitHub Release with that tag — the same
#     release the Linux AppImage goes on. If no release exists for the tag
#     yet, a DRAFT release is created, so nothing reaches anyone until the
#     release is published by hand. The tag must already exist (push it
#     first), and src/lib/appVersion.js at that tag must match it, or the
#     run stops — the updater trusts the version inside latest.yml, so a
#     mismatch would tell Windows users they're on a version they aren't.
#
# Auto-update: installed Windows copies poll the latest PUBLISHED release
# for latest.yml (Linux polls latest-linux.yml on the same release). So a
# release needs both platforms' files attached before it's published, or
# that platform simply doesn't see the update until it is.
#
# Unsigned: there's no code-signing certificate, so the installer shows a
# SmartScreen warning on first install. See docs/desktop-setup.md.

name: Desktop (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v0.248.0). Leave empty for a test build (download from the run's Artifacts)."
        required: false
        default: ""

permissions:
  contents: write   # needed to create a draft release / upload release assets

concurrency:
  group: desktop-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -e "const s=require('fs').readFileSync('src/lib/appVersion.js','utf8');const m=/APP_VERSION\s*=\s*[\"']([^\"']+)[\"']/.exec(s);if(!m)process.exit(1);process.stdout.write(m[1])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"
          if [ -n "$TAG" ] && [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match APP_VERSION $VERSION at that tag. Fix the tag or the version; the updater trusts the version in latest.yml."
            exit 1
          fi

      - name: Build installer
        env:
          # No certificate: make sure electron-builder doesn't go looking.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # --publish never: uploading is done explicitly below, so a test
        # build can never end up on a release by accident.
        run: npm run desktop:build:win -- --publish never

      - name: List output
        run: ls -la release

      - name: Keep the installer as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: OceansSymphony-${{ steps.version.outputs.version }}-windows
          path: |
            release/OceansSymphony-*-Setup.exe
            release/OceansSymphony-*-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the GitHub Release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No release for $TAG yet — creating it as a DRAFT."
            gh release create "$TAG" --draft --verify-tag \
              --title "Oceans Symphony ${TAG}" \
              --notes "Desktop builds for ${TAG}. Draft — publish when every platform's files are attached."
          fi
          gh release upload "$TAG" release/OceansSymphony-*-Setup.exe release/OceansSymphony-*-Setup.exe.blockmap release/latest.yml --clobber
          echo "Attached to $TAG:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
